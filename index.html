<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NexaCore - الفواتير والمحاسبة</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F4E79">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@600;700&display=swap">
<style>
/* Layout: شريط علوي بتبويبات، وتحته الفواتير كجدول، ومحرر الفاتورة بعمودين (نموذج + ملخص حسابات ثابت)، والمعاينة ورقة A4 مصغّرة */
:root{
  color-scheme:light;
  --bg:#EEF0F3;--surface:#FFFFFF;--surface-2:#F5F6F8;--ink:#17202A;--ink-2:#566371;--line:#D9DEE4;
  --accent:#1F4E79;--accent-ink:#FFFFFF;--accent-soft:#DCE8F3;
  --ok:#1E7B4B;--ok-soft:#DDF1E5;--warn:#8F5600;--warn-soft:#FBEBCB;--bad:#B3342B;--bad-soft:#F9DDDA;
  --f-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E151C;--surface:#151F29;--surface-2:#1B2733;--ink:#E6EDF2;--ink-2:#9DAEBC;--line:#283745;
  --accent-ink:#06121C;--accent-soft:#1B3347;
  --ok:#5FD08F;--ok-soft:#173826;--warn:#F0B35A;--warn-soft:#3A2C12;--bad:#F08A80;--bad-soft:#3E1F1C}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.65 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h2{font-size:15px;line-height:1.4}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{max-width:1220px;margin-inline:auto;padding-inline:16px;padding-block:14px 48px;display:flex;flex-direction:column;gap:14px}

/* top bar */
.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:38px;width:auto;max-width:120px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.brand h1{font-size:18px;line-height:1.3;overflow-wrap:anywhere}
.tabs{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:transparent;padding:6px 16px;border-radius:7px;cursor:pointer;color:var(--ink-2);font-weight:500;white-space:nowrap}
.tabs button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.sync{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);padding:3px 12px;border-radius:999px;max-width:100%}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.sync.on .dot{background:var(--ok)}

/* common */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card>h2{font-size:15px;margin-bottom:12px}
.sub{color:var(--ink-2);font-size:12.5px;margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 14px;border-radius:8px;cursor:pointer;font-weight:500;line-height:1.5;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:2px 10px;font-size:12px}
.btn:disabled{opacity:.55;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px}
input,select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
textarea{resize:vertical}
input[type=color]{padding:2px;height:36px;cursor:pointer}
.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2);font-weight:500;min-width:0}
.grid{display:grid;gap:10px 12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.grid .w2{grid-column:span 2}
.grid .full{grid-column:1/-1}
@media (max-width:480px){.grid .w2{grid-column:1/-1}}
.pill{display:inline-block;border-radius:999px;padding:1px 11px;font-size:12px;font-weight:600;white-space:nowrap}
.p-paid{background:var(--ok-soft);color:var(--ok)}
.p-partial{background:var(--warn-soft);color:var(--warn)}
.p-unpaid{background:var(--bad-soft);color:var(--bad)}
.p-void{background:var(--surface-2);color:var(--ink-2);text-decoration:line-through}
.banner{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 14px;font-size:13px}
.tw{overflow-x:auto}
.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{color:var(--ink-2);font-weight:600;font-size:12px;background:var(--surface-2)}
.tbl td.r,.tbl th.r{text-align:end}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--surface-2)}
.tbl td.wrap{white-space:normal;min-width:160px}
.empty{color:var(--ink-2);text-align:center;padding:30px 10px;margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:10px}
.kpi{padding:12px 16px;border-inline-start:1px solid var(--line);min-width:0}
.kpi:first-child{border-inline-start:0}
.kpi .k{font-size:12px;color:var(--ink-2);font-weight:500}
.kpi .v{font:500 22px/1.3 var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi.warn .v{color:var(--bad)}
.tools{display:flex;flex-wrap:wrap;gap:8px 10px}
.tools .grow{flex:1 1 220px;min-width:0}
.tools select{width:auto;min-width:130px}

/* editor */
.editor{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:1000px){.editor{grid-template-columns:minmax(0,1fr) 320px}.editor .side{position:sticky;top:12px}}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.irow{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr) minmax(0,1.3fr) auto;gap:8px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line)}
.irow .lt{font:500 14px var(--f-mono);padding:7px 0;text-align:end;font-variant-numeric:tabular-nums}
@media (max-width:860px){.irow{grid-template-columns:repeat(4,minmax(0,1fr))}.irow .nm{grid-column:1/-1}.irow .lt{text-align:start}}
.prow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.2fr) minmax(0,1.2fr) minmax(0,2fr) auto;gap:8px;align-items:end;padding:8px 0;border-bottom:1px solid var(--line)}
@media (max-width:700px){.prow{grid-template-columns:repeat(2,minmax(0,1fr))}.prow .nt{grid-column:1/-1}}
.sum .r{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:13.5px}
.sum .r b{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums}
.sum .net{border-top:1px solid var(--line);margin-top:4px;padding-top:8px;color:var(--accent);font-weight:600}
.sum .out{background:var(--accent-soft);border-radius:8px;padding:10px 12px;margin-top:8px;display:flex;justify-content:space-between;align-items:baseline;color:var(--accent);font-weight:600}
.sum .out b{font:600 22px var(--f-mono)}
details.more{border:1px dashed var(--line);border-radius:8px;padding:8px 12px}
details.more summary{cursor:pointer;font-size:13px;color:var(--ink-2);font-weight:500}
details.more .grid{margin-top:10px}

/* show */
.show{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:1000px){.show{grid-template-columns:320px minmax(0,1fr)}.show .side{position:sticky;top:12px}}
.paperwrap{position:relative;overflow:hidden;background:#C9D0D7;border-radius:10px;padding:0}
.paper{position:absolute;top:0;right:0;transform-origin:top right;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.25)}
.paper .pbreak{border-top:3px dashed #B8C0C8;margin:36px -40px 36px}
.pl{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.pl:last-child{border-bottom:0}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(10,18,26,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal[hidden]{display:none}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:460px;width:100%}
.modal h2{font-size:16px;margin-bottom:8px}
#toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:30}
#toast span{background:var(--ink);color:var(--surface);padding:8px 16px;border-radius:8px;font-size:13px;max-width:520px;box-shadow:0 4px 18px rgba(0,0,0,.3)}
#toast span.bad{background:var(--bad);color:#fff}
#toast:empty{display:none}
@media (prefers-reduced-motion:no-preference){.paper{transition:none}}

/* printable document: بيستخدمه المعاينة والطباعة والـ PDF بنفس القواعد */
#printRoot{display:none}
/* ---- المحاسبة ---- */
.tabs.sub{background:transparent;border:0;padding:0;gap:6px}
.tabs.sub button{border:1px solid var(--line);background:var(--surface);padding:4px 14px;font-size:13px}
.tabs.sub button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.tbl tr.k-head td{background:var(--surface-2);font-weight:700;color:var(--accent)}
.tbl tr.k-sub td{font-weight:700;border-top:1px solid var(--ink-2)}
.tbl tr.k-total td{font-weight:700;background:var(--accent-soft);color:var(--accent)}
.tbl tr.k-ehead td{background:var(--surface-2);border-top:2px solid var(--line);font-weight:500}
.tbl tr.k-line td{padding-block:3px;font-size:12.5px;color:var(--ink-2)}
.pill.p-src{background:var(--accent-soft);color:var(--accent);font-weight:500;font-size:11.5px}
.sub.bad,.badc{color:var(--bad);font-weight:600}.okc{color:var(--ok);font-weight:600}
.brow{grid-template-columns:minmax(0,3fr) minmax(0,3fr) minmax(0,1.5fr) auto}
.jrow{grid-template-columns:minmax(0,3.2fr) minmax(0,1.2fr) minmax(0,1.2fr) minmax(0,2fr) auto}
@media (max-width:860px){.brow,.jrow{grid-template-columns:repeat(2,minmax(0,1fr))}.brow .nm,.jrow .nm,.jrow .nt{grid-column:1/-1}}
.jtot{display:flex;flex-wrap:wrap;gap:6px 24px;padding-top:12px;font-size:13px}
.jtot b{font:500 14px var(--f-mono)}
.tools .f.grow{flex:1 1 220px}
.nav-note{font-size:12px}
@media print{.tabs{display:none!important}}
.fixed{background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:7px 10px;color:var(--ink-2);font-weight:600}

@media print{
  @page{size:A4;margin:10mm 0}
  html,body{background:#fff!important}
  #app,#toast,#modal{display:none!important}
  #printRoot{display:block!important}
  .pdfx .pbreak{break-before:page;height:0}
  .pdfx tr,.pdfx .keep{break-inside:avoid}
  .pdfx{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand" id="brand"></div>
    <nav class="tabs" id="tabs" aria-label="الأقسام"></nav>
    <div class="sync" id="sync"><span class="dot"></span><span id="syncTxt"></span></div>
  </header>
  <nav class="tabs sub" id="subtabs" aria-label="الأقسام الفرعية" hidden></nav>
  <div class="banner" id="fsBanner" hidden>
    <span id="fsBannerTxt"></span>
    <span class="btns"><button type="button" class="btn sm" id="fsBannerBtn"></button><button type="button" class="btn sm" id="fsBannerOff">لاحقًا</button></span>
  </div>
  <main id="main"></main>
</div>
<div id="printRoot" class="pdfx" dir="rtl" lang="ar"></div>
<div class="modal" id="modal" hidden><div class="box" id="modalBox" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function pad(n,w){return String(n).padStart(w||2,'0')}
function dg(s){return String(s).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)}).replace(/٫/g,'.').replace(/[٬،,]/g,'')}
function num(v){var n=parseFloat(dg(v==null?'':v).replace(/[^\d.\-]/g,''));return isFinite(n)?n:0}
function r2(n){var s=n<0?-1:1;return s*Math.round((Math.abs(n)+1e-9)*100)/100}
function money(n){n=r2(n);var a=Math.abs(n),s=a.toLocaleString('en-US',{minimumFractionDigits:(a%1)?2:0,maximumFractionDigits:2});return (n<0?'-':'')+s}
function moneyH(n){var m=money(n),i=m.lastIndexOf('.');return i<0?m:m.slice(0,i)+'<span class="dec">'+m.slice(i)+'</span>'}
function qty(n){return String(Math.round(num(n)*1000)/1000)}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function clone(o){return JSON.parse(JSON.stringify(o))}

/* ---------- default content ---------- */
var DEFAULT_TERMS=[
['المنتجات والمواصفات','تحدد الفاتورة أكواد المنتجات والألوان والمقاسات والكميات والأسعار. يعتمد العميل العينات والمواصفات قبل التوريد. الاختلافات الطبيعية البسيطة في اللون أو الملمس ضمن حدود مواصفات المنتج لا تُعد عيبًا، ولا تبرر تغيير الكود أو قبول منتج مخالف للمتفق عليه.'],
['المقاسات والكميات','تُراجع المقاسات والكميات قبل اعتماد الطلب، وتوضح الفاتورة نسبة الهالك أو التقريب إن وجدت. أي زيادة في الكميات تتطلب موافقة العميل، وتُسجَّل أي تعديلات في مستند مستقل.'],
['الأسعار ونطاق العمل','تبيّن الفاتورة السعر الإجمالي والضرائب، وهل تشمل التوريد والتوصيل والتركيب والملحقات. الأعمال الإضافية مثل تجهيز الموقع أو فك القديم أو التعديلات الإضافية تتطلب موافقة العميل المسبقة على تكلفتها.'],
['السداد','تُسجَّل كل دفعة بإيصال رسمي يوضح المبلغ وطريقة الدفع ورقم الفاتورة. مواعيد استحقاق الدفعات مدوّنة أدناه، وأي تعديل عليها يتم كتابةً بموافقة الطرفين.'],
['التسليم والتركيب','تُحدد المواعيد بعد تأكيد توفر المنتج واستلام الدفعة المطلوبة وجاهزية الموقع. عند حدوث تأخير يُبلَّغ العميل بالسبب والموعد الجديد، ويتفق الطرفان كتابةً على الإجراء المناسب بما يحفظ حقوق كل منهما.'],
['جاهزية الموقع','يجب أن يكون الموقع نظيفًا ومناسبًا للتركيب، وأن تكون الأعمال الرطبة قد انتهت. يعاين فريق التركيب الموقع قبل البدء ويبلغ العميل بأي أعمال تجهيز مطلوبة وتكلفتها قبل المتابعة.'],
['المعاينة والاستلام','تُراجع أكواد المنتجات والكميات وحالة التغليف عند التسليم، وتُسجَّل أي ملاحظات في محضر الاستلام. عند وجود عيب أو اختلاف يتوقف تركيب البنود المتأثرة ويُبلَّغ المورد للمعاينة. الاستلام لا يُسقط الحق في العيوب الخفية.'],
['التعديل والإرجاع','تُوثَّق طلبات التعديل أو الإلغاء أو الاستبدال أو الإرجاع، وتُقيَّم حسب حالة الطلب ونوع المنتج والقانون المعمول به. لا تُطبَّق أي خصومات أو رسوم تلقائيًا، وتُوثَّق أي تسوية كتابةً دون الإخلال بحقوق المستهلك.'],
['الضمان والصيانة','تُحدد مدة الضمان ونطاقه والجهة المسؤولة عن ضمان المنتج وضمان التركيب كتابةً، وتُسلَّم تعليمات الاستخدام والتنظيف. تُعاين الشكاوى لتحديد السبب، ولا يسقط الضمان دون تفسير فني، وتظل الحقوق القانونية محفوظة.']
];

function normDB(o){
  var d=defDB();
  if(o&&typeof o==='object'){
    d.settings=Object.assign(d.settings,o.settings||{});
    d.settings.acct=Object.assign({},ACCT0,(o.settings&&o.settings.acct)||{});
    ['customers','items','invoices','suppliers','bills','expenses','journal'].forEach(function(k){d[k]=Array.isArray(o[k])?o[k].filter(function(x){return x&&x.id}):[]});
    d.accounts=Array.isArray(o.accounts)&&o.accounts.length?o.accounts.filter(function(a){return a&&a.code}):defChart();
    
    d.bills.forEach(function(b){b.lines=Array.isArray(b.lines)?b.lines:[];b.payments=Array.isArray(b.payments)?b.payments:[]});
    d.journal.forEach(function(j){j.lines=Array.isArray(j.lines)?j.lines:[]});

/* ---------- calculations ---------- */
function lineTotal(it){return r2(num(it.qty)*num(it.price))}
function calc(v){
  var sub=0;v.items.forEach(function(it){sub+=lineTotal(it)});sub=r2(sub);
  var disc=v.discType==='pct'?r2(sub*num(v.discVal)/100):r2(num(v.discVal));
  if(disc>sub)disc=sub;if(disc<0)disc=0;
  var taxable=r2(sub-disc),tax=r2(taxable*num(v.taxPct)/100),net=r2(taxable+tax);
  var paid=0;v.payments.forEach(function(p){paid+=num(p.amount)});paid=r2(paid);
  return {sub:sub,disc:disc,tax:tax,net:net,paid:paid,out:r2(net-paid)};
}
function statusOf(v,c){if(v.void)return 'void';if(c.net>0&&c.out<=0)return 'paid';if(c.paid>0)return 'partial';return 'unpaid'}
function pill(v,c){var s=statusOf(v,c);return '<span class="pill p-'+s+'">'+STL[s]+'</span>'}
function nextNo(){var S=DB.settings;return (S.prefix||'')+pad(Math.max(1,Math.floor(num(S.next))||1),6)}
function byId(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null}

function hex2rgb(h){h=String(h||'').replace('#','');if(h.length===3)h=h.split('').map(function(x){return x+x}).join('');var n=parseInt(h,16);return isNaN(n)||h.length!==6?[31,78,121]:[(n>>16)&255,(n>>8)&255,n&255]}
function rgb2hex(a){return '#'+a.map(function(x){return pad(Math.max(0,Math.min(255,Math.round(x))).toString(16))}).join('')}
function mix(h,w,t){var a=hex2rgb(h),b=hex2rgb(w);return rgb2hex(a.map(function(x,i){return x*(1-t)+b[i]*t}))}
function lum(h){var a=hex2rgb(h).map(function(x){x/=255;return x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4)});return .2126*a[0]+.7152*a[1]+.0722*a[2]}

        '<div style="position:absolute;left:0;top:'+(PDFM+hh2)+'px;width:'+PDFW+'px;height:'+h+'px;overflow:hidden"><div style="margin-top:-'+p[0]+'px">'+inner+'</div></div></div></foreignObject></svg>';
      var img=await loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg));
      var cv=document.createElement('canvas');cv.width=PDFW*PDFS;cv.height=PDFH*PDFS;
      var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);
      cx.drawImage(img,0,0,cv.width,cv.height);
      if(pages.length>1){cx.fillStyle='#6A7683';cx.font=(10*PDFS)+'px '+PF;cx.textAlign='center';cx.fillText((i+1)+' / '+pages.length,cv.width/2,(PDFH-16)*PDFS)}
      var blob=await new Promise(function(r){cv.toBlob(r,'image/jpeg',0.92)});
      if(!blob)throw new Error('jpeg');
      out.push(new Uint8Array(await blob.arrayBuffer()));
    }
    return out;
  }finally{host.remove()}
}

function buildPdf(jpgs){
  var enc=new TextEncoder(),parts=[],offs=[],len=0,n=jpgs.length,i;
  function add(x){var b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length}
  function begin(id){offs[id]=len;add(id+' 0 obj\n')}
  add(new Uint8Array([37,80,68,70,45,49,46,52,10,37,226,227,207,211,10]));
  begin(1);add('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  var kids=[];for(i=0;i<n;i++)kids.push((3+i*3)+' 0 R');
  begin(2);add('<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+n+' >>\nendobj\n');
  for(i=0;i<n;i++){
    var pid=3+i*3,cid=pid+1,iid=pid+2,cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    begin(pid);add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 '+iid+' 0 R >> >> /Contents '+cid+' 0 R >>\nendobj\n');
    begin(cid);add('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream\nendobj\n');
    begin(iid);add('<< /Type /XObject /Subtype /Image /Width '+(PDFW*PDFS)+' /Height '+(PDFH*PDFS)+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpgs[i].length+' >>\nstream\n');
    add(jpgs[i]);add('\nendstream\nendobj\n');
  }
  var xr=len,cnt=3+n*3;
  add('xref\n0 '+cnt+'\n0000000000 65535 f \n');
  for(i=1;i<cnt;i++)add(('0000000000'+offs[i]).slice(-10)+' 00000 n \n');
  add('trailer\n<< /Size '+cnt+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF\n');
  return new Blob(parts,{type:'application/pdf'});
}
function download(name,data,type){

function setDraftField(el){
  var d=UI.draft;if(!d)return;
  if(el.dataset.f){
    var k=el.dataset.f;d[k]=el.type==='checkbox'?el.checked:el.value;
    if(k==='customerName'){
      var c=DB.customers.filter(function(x){return x.name.trim().toLowerCase()===d.customerName.trim().toLowerCase()})[0];
      if(c){d.customerId=c.id;if(!d.phone){d.phone=c.phone||'';$('[data-f=phone]').value=d.phone}if(!d.address){d.address=c.address||'';$('[data-f=address]').value=d.address}}else d.customerId='';
    }
  }else if(el.dataset.row){
    var r=d[el.dataset.row][+el.dataset.i];if(!r)return;r[el.dataset.k]=el.value;
    if(el.dataset.row==='items'&&el.dataset.k==='name'){
      var it=DB.items.filter(function(x){return x.name.trim().toLowerCase()===el.value.trim().toLowerCase()})[0];
      if(it&&!r.price&&!r.code){r.code=it.code||'';r.unit=it.unit||r.unit;r.price=it.price||'';
        var row=el.closest('.irow');$('[data-k=code]',row).value=r.code;$('[data-k=unit]',row).value=r.unit;$('[data-k=price]',row).value=r.price}
    }
  }else if(el.dataset.ag){d.agreed[el.dataset.ag]=el.value}
  updateTotals();
}
function saveInvoice(){
  var d=UI.draft,S=DB.settings;
  d.items=d.items.filter(function(it){return it.name.trim()||num(it.price)||it.code});
  if(!d.customerName.trim()){toast('اكتب اسم العميل الأول.',true);return}
  if(!d.items.length){toast('أضف بند واحد على الأقل.',true);return}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date||'')){toast('اختار تاريخ الفاتورة.',true);return}
  d.no=d.no.trim()||nextNo();
  if(DB.invoices.some(function(v){return v.no===d.no&&v.id!==d.id})){toast('رقم الفاتورة «'+d.no+'» مستخدم قبل كده. غيّره.',true);return}
  var cust=DB.customers.filter(function(x){return x.name.trim().toLowerCase()===d.customerName.trim().toLowerCase()})[0];
  if(!cust){cust={id:uid(),name:d.customerName.trim(),phone:d.phone.trim(),address:d.address.trim()};DB.customers.push(cust)}
  d.customerId=cust.id;
  d.items.forEach(function(it){
    if(!it.name.trim())return;
    var f=DB.items.filter(function(x){return x.name.trim().toLowerCase()===it.name.trim().toLowerCase()})[0];
    if(!f)DB.items.push({id:uid(),name:it.name.trim(),code:it.code||'',unit:it.unit||'',price:it.price||''});
  });
  d.payments=d.payments.filter(function(p){return num(p.amount)>0});
  if(d.no===nextNo())S.next=(Math.floor(num(S.next))||1)+1;
  var rec=clone(d);delete rec.isNew;
  var i=DB.invoices.map(function(v){return v.id}).indexOf(d.id);
  if(i<0)DB.invoices.push(rec);else DB.invoices[i]=rec;
  save();UI.cur=d.id;UI.view='show';UI.draft=null;render();toast('اتحفظت الفاتورة.');
}

var NAV=[
 ['sales','المبيعات',[['invoices','الفواتير'],['customers','العملاء'],['items','الأصناف']]],
 ['buy','المشتريات',[['bills','فواتير الموردين'],['suppliers','الموردون'],['expenses','المصروفات']]],
 ['acct','المحاسبة',[['journal','القيود'],['coa','شجرة الحسابات'],['ledger','دفتر الأستاذ'],['trial','ميزان المراجعة']]],
 ['rep','التقارير',[['income','قائمة الدخل'],['balance','الميزانية'],['vat','الضريبة'],['statement','كشف حساب']]],
 ['set','الإعدادات',[['settings','الإعدادات']]]
];

var AU={bill:null,jv:null,editE:null,editS:null,editA:null,rf:today().slice(0,4)+'-01-01',rt:today(),acct:'',pty:'c',ptyId:'',bq:'',eq:'',jq:'',jsrc:'all',pend:null,inv:''};
function groupOf(t){for(var i=0;i<NAV.length;i++)for(var j=0;j<NAV[i][2].length;j++)if(NAV[i][2][j][0]===t)return NAV[i];return NAV[0]}
function A(k){return DB.settings.acct[k]}
function acctBy(c){for(var i=0;i<DB.accounts.length;i++)if(DB.accounts[i].code===c)return DB.accounts[i];return null}
function acctName(c){var a=acctBy(c);return a?a.name:c+' (غير موجود)'}
function acctLabel(c){return c+' - '+acctName(c)}
function cmpCode(a,b){return a.code<b.code?-1:a.code>b.code?1:0}
function cashM(){return String(DB.settings.cashMethods||'').split(/[,،\n]+/).map(function(x){return x.trim()}).filter(Boolean)}
function payAcct(m){return cashM().indexOf(String(m||'').trim())>=0?A('cash'):A('bank')}
function ln(L,a,dr,cr){dr=r2(dr);cr=r2(cr);if(dr||cr)L.push({acct:a,dr:dr,cr:cr})}
function billCalc(b){var s=0;b.lines.forEach(function(l){s+=num(l.amount)});s=r2(s);var tax=r2(s*num(b.taxPct)/100),tot=r2(s+tax),p=0;b.payments.forEach(function(x){p+=num(x.amount)});p=r2(p);return {sub:s,tax:tax,total:tot,paid:p,out:r2(tot-p)}}
function expCalc(e){var a=r2(num(e.amount)),t=r2(a*num(e.taxPct)/100);return {amt:a,tax:t,total:r2(a+t)}}
function billPill(c){var s=c.total>0&&c.out<=0?'paid':c.paid>0?'partial':'unpaid';return '<span class="pill p-'+s+'">'+STL[s]+'</span>'}
function nextOf(pre,n){return (pre||'')+pad(Math.max(1,Math.floor(num(n))||1),6)}

/* ---------- القيود (بتتولد من المستندات، والقيود اليدوية متخزنة) ---------- */
function entries(){
  var E=[];
  DB.invoices.forEach(function(v){
    if(v.void)return;var c=calc(v),L=[];
    ln(L,A('ar'),c.net,0);ln(L,A('disc'),c.disc,0);ln(L,A('sales'),0,c.sub);ln(L,A('vatOut'),0,c.tax);
    E.push({date:v.date,src:'inv',ref:v.no,memo:'فاتورة بيع - '+v.customerName,lines:L});
    v.payments.forEach(function(p){var a=r2(num(p.amount));if(a<=0)return;var L2=[];ln(L2,payAcct(p.method),a,0);ln(L2,A('ar'),0,a);
      E.push({date:p.date||v.date,src:'rc',ref:v.no,memo:'تحصيل فاتورة '+v.no+' - '+v.customerName+(p.method?' ('+p.method+')':''),lines:L2})});
  });
  DB.bills.forEach(function(b){
    var c=billCalc(b),L=[];
    b.lines.forEach(function(l){ln(L,l.acct,num(l.amount),0)});ln(L,A('vatIn'),c.tax,0);ln(L,A('ap'),0,c.total);
    E.push({date:b.date,src:'bill',ref:b.no,memo:'فاتورة مورد - '+b.supplierName+(b.ref?' ('+b.ref+')':''),lines:L});
    b.payments.forEach(function(p){var a=r2(num(p.amount));if(a<=0)return;var L2=[];ln(L2,A('ap'),a,0);ln(L2,payAcct(p.method),0,a);
      E.push({date:p.date||b.date,src:'bp',ref:b.no,memo:'سداد للمورد '+b.supplierName+(p.method?' ('+p.method+')':''),lines:L2})});
  });
  DB.expenses.forEach(function(x){
    var c=expCalc(x),L=[];ln(L,x.acct,c.amt,0);ln(L,A('vatIn'),c.tax,0);ln(L,payAcct(x.method),0,c.total);
    E.push({date:x.date,src:'exp',ref:'',memo:'مصروف - '+(x.desc||acctName(x.acct)),lines:L});
  });
  DB.journal.forEach(function(j){
    E.push({date:j.date,src:'jv',ref:j.no,memo:j.memo,jid:j.id,lines:j.lines.map(function(l){return {acct:l.acct,dr:r2(num(l.dr)),cr:r2(num(l.cr))}}).filter(function(l){return l.dr||l.cr})});
  });
  E.forEach(function(e,i){e.i=i});
  E.sort(function(a,b){return (a.date||'').localeCompare(b.date||'')||a.i-b.i});
  return E;
}
function tally(from,to,E){
  var T={};(E||entries()).forEach(function(e){
    if(from&&e.date<from)return;if(to&&e.date>to)return;
    e.lines.forEach(function(l){var t=T[l.acct]||(T[l.acct]={dr:0,cr:0});t.dr=r2(t.dr+l.dr);t.cr=r2(t.cr+l.cr)});
  });return T;
}
function sgn(type){return (type==='asset'||type==='exp')?1:-1}
function balOf(T,code){var t=T[code];if(!t)return 0;var a=acctBy(code);return r2((t.dr-t.cr)*sgn(a?a.type:'asset'))}
function chartWith(T){
  var l=DB.accounts.slice();Object.keys(T).forEach(function(c){if(!acctBy(c))l.push({code:c,name:c+' (غير موجود)',type:'asset'})});
  return l.sort(cmpCode);
}
function fmtBal(x){x=r2(x);return x===0?'0':money(Math.abs(x))+(x>0?' مدين':' دائن')}

/* ---------- بيانات التقارير ---------- */
function periodTxt(){return 'عن الفترة من '+AU.rf+' إلى '+AU.rt}
function repIncome(){
  var T=tally(AU.rf,AU.rt),ac=DB.accounts.slice().sort(cmpCode),rows=[];
  function group(title,list){
    rows.push({k:'head',c:['',title,'']});var t=0;
    list.forEach(function(a){var x=balOf(T,a.code);if(x===0)return;rows.push({c:[a.code,a.name,x]});t=r2(t+x)});
    return t;
  }
  var rev=group('الإيرادات',ac.filter(function(a){return a.type==='rev'}));rows.push({k:'sub',c:['','صافي الإيرادات',rev]});
  var cg=group('تكلفة المبيعات / المشتريات',ac.filter(function(a){return a.type==='exp'&&a.cogs}));rows.push({k:'sub',c:['','إجمالي التكلفة',cg]});
  var gp=r2(rev-cg);rows.push({k:'total',c:['','مجمل الربح',gp]});
  var ox=group('المصروفات التشغيلية',ac.filter(function(a){return a.type==='exp'&&!a.cogs}));rows.push({k:'sub',c:['','إجمالي المصروفات',ox]});
  var np=r2(gp-ox);rows.push({k:'total',c:['',np>=0?'صافي الربح':'صافي الخسارة',np]});
  return {title:'قائمة الدخل',sub:periodTxt(),sections:[{cols:[{h:'الكود',w:12},{h:'البند',w:60,nm:1},{h:'المبلغ',w:28}],rows:rows}],kind:'income'};
}
function repBalance(){
  var T=tally('',AU.rt),ac=chartWith(T),rows=[],np=0;
  ac.forEach(function(a){if(a.type==='rev')np=r2(np+balOf(T,a.code));if(a.type==='exp')np=r2(np-balOf(T,a.code))});
  function group(title,type,extra){
    rows.push({k:'head',c:['',title,'']});var t=0;
    ac.filter(function(a){return a.type===type}).forEach(function(a){var x=balOf(T,a.code);if(x===0)return;rows.push({c:[a.code,a.name,x]});t=r2(t+x)});
    if(extra){rows.push({c:['','صافي أرباح (خسائر) الفترة حتى التاريخ',np]});t=r2(t+np)}
    return t;
  }
  var A1=group('الأصول','asset');rows.push({k:'total',c:['','إجمالي الأصول',A1]});
  var L1=group('الخصوم','liab');rows.push({k:'sub',c:['','إجمالي الخصوم',L1]});
  var E1=group('حقوق الملكية','equity',true);rows.push({k:'sub',c:['','إجمالي حقوق الملكية',E1]});
  var tot=r2(L1+E1);rows.push({k:'total',c:['','إجمالي الخصوم وحقوق الملكية',tot]});
  var diff=r2(A1-tot);
  return {title:'الميزانية العمومية',sub:'في تاريخ '+AU.rt,sections:[{cols:[{h:'الكود',w:12},{h:'البند',w:60,nm:1},{h:'المبلغ',w:28}],rows:rows}],note:diff===0?'الميزانية متزنة: الأصول = الخصوم + حقوق الملكية.':'تنبيه: فيه فرق '+money(diff)+' بين الأصول والخصوم وحقوق الملكية. راجع القيود.',bad:diff!==0,kind:'balance'};
}
function repTrial(){
  var T=tally('',AU.rt),rows=[],td=0,tc=0,bd=0,bc=0;
  chartWith(T).forEach(function(a){
    var t=T[a.code];if(!t)return;var d=r2(t.dr-t.cr),x=d>0?d:0,y=d<0?-d:0;

function repStatement(){

  if(!p)return {title:'كشف حساب',sub:'اختار عميل أو مورد من الأعلى',sections:[{cols:cols,rows:[]}],kind:'statement'};
  var ev=[];
  if(isC)DB.invoices.forEach(function(v){
    if(v.void||(v.customerId!==p.id))return;var c=calc(v);ev.push({d:v.date,o:0,t:'فاتورة '+v.no,dr:c.net,cr:0});
    v.payments.forEach(function(x){var a=r2(num(x.amount));if(a>0)ev.push({d:x.date||v.date,o:1,t:'دفعة '+v.no+(x.method?' ('+x.method+')':''),dr:0,cr:a})});
  });
  else DB.bills.forEach(function(b){
    if(b.supplierId!==p.id)return;var c=billCalc(b);ev.push({d:b.date,o:0,t:'فاتورة مورد '+b.no,dr:0,cr:c.total});
    b.payments.forEach(function(x){var a=r2(num(x.amount));if(a>0)ev.push({d:x.date||b.date,o:1,t:'سداد '+b.no+(x.method?' ('+x.method+')':''),dr:a,cr:0})});

  var bal=0,rows=[],td=0,tc=0;

  rows.push({k:'sub',c:['','رصيد أول الفترة',null,null,bal]});

  rows.push({k:'total',c:['',isC?'الرصيد المستحق على العميل':'الرصيد المستحق للمورد',td,tc,bal]});
  return {title:(isC?'كشف حساب عميل: ':'كشف حساب مورد: ')+p.name,sub:periodTxt(),sections:[{cols:cols,rows:rows}],kind:'statement'};
}

function saveBill(){

  if(!sp){sp={id:uid(),name:d.supplierName.trim(),phone:'',address:''};DB.suppliers.push(sp)}

  d.payments=d.payments.filter(function(p){return num(p.amount)>0});

var CK='invoicing.cloud',CL={url:'',key:'',sess:null,rev:'',dirty:false,st:'off',msg:''},cloudT=null,cloudBusy=false,cloudAgain=false;
var CLOUD_SQL="-- شغّل الملف ده مرة واحدة في Supabase: SQL Editor ثم New query ثم الصق ثم Run\ncreate table if not exists public.app_data (\n  user_id uuid primary key references auth.users(id) on delete cascade,\n  data jsonb not null,\n  updated_at timestamptz not null default now()\n);\n\ncreate or replace function public.app_data_touch() returns trigger\nlanguage plpgsql as $$\nbegin\n  new.updated_at := now();\n  return new;\nend $$;\n\ndrop trigger if exists app_data_touch on public.app_data;\ncreate trigger app_data_touch before insert or update on public.app_data\nfor each row execute function public.app_data_touch();\n\nalter table public.app_data enable row level security;\n\ndrop policy if exists \"own row\" on public.app_data;\ncreate policy \"own row\" on public.app_data\n  for all to authenticated\n  using (auth.uid() = user_id)\n  with check (auth.uid() = user_id);\n";
function cloudLoad(){try{var o=JSON.parse(localStorage.getItem(CK)||'{}');CL.url=o.url||'';CL.key=o.key||'';CL.sess=o.sess||null;CL.rev=o.rev||'';CL.dirty=!!o.dirty}catch(e){}CL.st=CL.sess?'idle':'off'}
function cloudSave(){try{localStorage.setItem(CK,JSON.stringify({url:CL.url,key:CL.key,sess:CL.sess,rev:CL.rev,dirty:CL.dirty}))}catch(e){}}
function cloudOn(){return !!(CL.url&&CL.key&&CL.sess)}
function cloudClean(u){return String(u||'').trim().replace(/\/+$/,'').replace(/\/(rest|auth)\/v1.*$/,'')}
async function cfetch(path,opt,auth){
  opt=opt||{};var h=Object.assign({apikey:CL.key,'Content-Type':'application/json'},opt.headers||{});
  if(auth!==false&&CL.sess)h.Authorization='Bearer '+CL.sess.access_token;
  return fetch(CL.url+path,{method:opt.method||'GET',headers:h,body:opt.body});
}
function jwtSub(t){try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).sub}catch(e){return ''}}
function setSess(j){
  if(!j||!j.access_token)return false;
  CL.sess={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),email:(j.user&&j.user.email)||(CL.sess&&CL.sess.email)||'',uid:(j.user&&j.user.id)||jwtSub(j.access_token)};
  cloudSave();return true;
}
async function cloudAuth(mode,email,pass){
  var path=mode==='signup'?'/auth/v1/signup':'/auth/v1/token?grant_type=password';
  var r=await cfetch(path,{method:'POST',body:JSON.stringify({email:email,password:pass})},false);
  var j=await r.json().catch(function(){return {}});
  if(!r.ok)throw new Error(j.msg||j.error_description||j.message||j.error||('HTTP '+r.status));
  return j;
}
async function ensureTok(){
  if(!CL.sess)throw new Error('login');
  if(CL.sess.expires_at-60>Date.now()/1000)return;
  var r=await cfetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:CL.sess.refresh_token})},false);
  var j=await r.json().catch(function(){return {}});
  if(!r.ok||!j.access_token){CL.sess=null;CL.st='off';cloudSave();throw new Error('login')}
  setSess(j);
}
function cloudErr(e){
  var m=String(e&&e.message||e);
  if(m==='login')return 'انتهت جلسة الدخول. سجّل دخول تاني.';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return 'مفيش اتصال بالسيرفر (إنترنت أو الرابط غلط).';
  if(/Invalid login/i.test(m))return 'الإيميل أو كلمة السر غلط.';
  if(/relation .*app_data|schema cache|42P01|PGRST205/i.test(m))return 'الجدول app_data مش موجود. شغّل ملف SQL في Supabase الأول.';
  return m;
}
async function cloudPull(){
  await ensureTok();
  var r=await cfetch('/rest/v1/app_data?select=data,updated_at');
  if(!r.ok){var j=await r.json().catch(function(){return {}});throw new Error(j.message||j.hint||('HTTP '+r.status))}
  var a=await r.json();return a[0]||null;
}
async function cloudPush(){
  await ensureTok();
  var r=await cfetch('/rest/v1/app_data?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify({user_id:CL.sess.uid,data:DB})});
  if(!r.ok){var j=await r.json().catch(function(){return {}});throw new Error(j.message||j.hint||('HTTP '+r.status))}
  var a=await r.json();CL.rev=(a[0]&&a[0].updated_at)||CL.rev;CL.dirty=false;cloudSave();
}
function cloudMark(){if(!cloudOn())return;CL.dirty=true;cloudSave();clearTimeout(cloudT);cloudT=setTimeout(cloudSync,1500)}
function busyEditing(){return UI.view==='edit'||AU.bill||AU.jv||(document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)&&document.activeElement.closest('#main'))}
async function cloudSync(force){
  if(!cloudOn())return;
  if(cloudBusy){cloudAgain=true;return}
  cloudBusy=true;CL.st='busy';cloudUi();
  try{
    var rem=await cloudPull(),needPush=CL.dirty||!rem,changed=false;
    if(rem&&rem.updated_at!==CL.rev){
      var rd=normDB(rem.data);
      if(!CL.rev&&countDB(DB)>0&&countDB(rd)>0&&JSON.stringify(rd)!==JSON.stringify(DB)){
        var ch=await ask('البيانات الأونلاين','الحساب ده فيه بيانات أونلاين ('+rd.invoices.length+' فاتورة بيع و'+rd.bills.length+' فاتورة مورد)، وعلى الجهاز ده '+DB.invoices.length+' و'+DB.bills.length+'. تعمل إيه؟',[['استخدام البيانات الأونلاين','cloud',true],['دمج الاتنين','merge'],['الكتابة فوق الأونلاين ببيانات الجهاز','local']]);
        if(ch==='cloud'){DB=rd;needPush=false}else if(ch==='merge'){DB=mergeDB(rd);needPush=true}else needPush=true;
      }else if(CL.dirty){DB=mergeDB(rd);needPush=true}
      else{DB=rd;needPush=false}
      changed=true;
      cacheLocal();applyAccent();if(dirH&&fsState==='ok')writeFile();
      if(!busyEditing())render();
    }
    if(needPush)await cloudPush();else{CL.rev=rem?rem.updated_at:CL.rev;CL.dirty=false;cloudSave()}
    CL.st='ok';CL.msg='';CL.last=new Date();
  }catch(e){CL.st='err';CL.msg=cloudErr(e)}
  cloudBusy=false;cloudUi();
  if(cloudAgain){cloudAgain=false;setTimeout(cloudSync,300)}
}

function readLogo(file){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var s=Math.min(1,600/img.width,300/img.height),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      DB.settings.logo=c.toDataURL('image/png');save();render();toast('اتحفظ اللوجو.');
    };
    img.onerror=function(){toast('الملف ده مش صورة مقروءة.',true)};
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}

function mergeDB(file){

  var am={};m.accounts.forEach(function(a){am[a.code]=a});file.accounts.forEach(function(a){am[a.code]=a});m.accounts=Object.keys(am).sort().map(function(c){return am[c]});

var FSA=!!window.showDirectoryPicker,dirH=null,dirName='',fsState='none',wq=Promise.resolve(),bannerOff=false,lastBk=0,DATAFILE='invoices-data.json';
function idb(){return new Promise(function(res,rej){var r=indexedDB.open('invoicing-handle',1);r.onupgradeneeded=function(){r.result.createObjectStore('h')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function idbGet(k){return idb().then(function(d){return new Promise(function(res,rej){var q=d.transaction('h').objectStore('h').get(k);q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)}})})}
function idbSet(k,v){return idb().then(function(d){return new Promise(function(res,rej){var tx=d.transaction('h','readwrite');if(v===undefined)tx.objectStore('h').delete(k);else tx.objectStore('h').put(v,k);tx.oncomplete=function(){res()};tx.onerror=function(){rej(tx.error)}})})}
async function readFolder(h){
  var dd=await h.getDirectoryHandle('data',{create:true}),f,txt;
  try{f=await (await dd.getFileHandle(DATAFILE)).getFile();txt=await f.text()}catch(e){if(e&&e.name==='NotFoundError')return null;throw e}
  if(!txt.trim())return null;
  var o=JSON.parse(txt);if(!o||typeof o!=='object'||!(o.data||o.invoices))throw new Error('bad');
  return normDB(o.data||o);
}
async function putFile(dir,name,body){var fh=await dir.getFileHandle(name,{create:true}),w=await fh.createWritable();await w.write(body);await w.close()}
async function writeBackup(body){
  var bd=await dirH.getDirectoryHandle('backups',{create:true});
  await putFile(bd,'backup-'+today()+'.json',body);
  var names=[];for await(var ent of bd.entries()){if(/^backup-.*\.json$/.test(ent[0]))names.push(ent[0])}
  names.sort();while(names.length>30)await bd.removeEntry(names.shift());
}
function bodyNow(){return JSON.stringify({app:'invoicing',v:2,savedAt:new Date().toISOString(),data:DB},null,1)}
function writeFile(force){
  if(!dirH||fsState!=='ok')return wq;
  var body=bodyNow();
  wq=wq.then(async function(){
    var dd=await dirH.getDirectoryHandle('data',{create:true});
    await putFile(dd,DATAFILE,body);
    if(force||Date.now()-lastBk>600000){lastBk=Date.now();await writeBackup(body)}
  }).catch(function(){fsState='needs';fsUi();toast('الحفظ في الفولدر وقف. اضغط «تأكيد التصريح» فوق.',true)});
  return wq;
}

async function ensureRW(h){var o={mode:'readwrite'};if((await h.queryPermission(o))==='granted')return true;return (await h.requestPermission(o))==='granted'}
async function adopt(h){
  var fileDB=await readFolder(h);
  if(fileDB&&countDB(fileDB)){
    if(countDB(DB)>0&&JSON.stringify(fileDB)!==JSON.stringify(DB)){
      var ch=await ask('الفولدر فيه بيانات','الفولدر فيه '+fileDB.invoices.length+' فاتورة بيع و'+fileDB.bills.length+' فاتورة مورد، والمتصفح فيه '+DB.invoices.length+' و'+DB.bills.length+'. تعمل إيه؟',[['استخدام بيانات الفولدر','file',true],['دمج الاتنين','merge'],['الكتابة فوق الفولدر ببيانات المتصفح','local']]);
      if(ch==='file')DB=fileDB;else if(ch==='merge')DB=mergeDB(fileDB);
    }else if(countDB(DB)===0)DB=fileDB;
  }
  dirH=h;dirName=h.name;fsState='ok';dirty=false;
  try{await idbSet('dir',h)}catch(e){}
  cacheLocal();applyAccent();render();
  await writeFile(true);
}
async function resume(){
  try{
    var fileDB=await readFolder(dirH);

    fsState='ok';dirty=false;cacheLocal();applyAccent();render();
    await writeFile();
  }catch(e){fsState='needs';fsUi();toast('ماقدرتش أقرا بيانات الفولدر. اتأكد إنه لسه في مكانه، أو اختار فولدر تاني.',true)}

}
